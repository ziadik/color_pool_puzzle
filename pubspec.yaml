name: color_pool_puzzle
description: Ball puzzle game with walls and holes
version: 1.0.0

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.4
  audioplayers: ^6.6.0
  vibration: ^3.1.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  package_info_plus: ^9.0.0
  # url_launcher: ^6.3.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/
    # - assets/images/
  fonts:
      - family: Roboto
        fonts:
        - asset: assets/fonts/Roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/Roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/Roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/Roboto/Roboto-Bold.ttf
          weight: 700
  # fonts:
  #   - family: SFPro
  #     fonts:
  #       - asset: assets/fonts/SF-Pro-Text-Regular.ttf
  #       - asset: assets/fonts/SF-Pro-Text-Bold.ttf
  #         weight: 700
